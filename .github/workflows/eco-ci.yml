name: Eco CI Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  eco-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Application
        run: python app.py
