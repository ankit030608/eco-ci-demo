
name: Eco CI Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  eco-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Start Eco-CI Measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: start-measurement

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Application
        run: python app.py

      - name: Measure Energy Consumption
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: "Python Application Execution"

      - name: Display Eco-CI Results
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: display-results
